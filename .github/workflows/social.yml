name: social

# Posts each short whose slot has passed to Instagram (Meta app) and TikTok (Post for Me). Videos and post.json
# come from this repo's draft releases. Idempotent: the encrypted state.enc records each finished post and is
# committed back. Started every 30 minutes by an outside cron trigger; the schedule below is the fallback.
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "List what would be posted, post nothing"
        type: boolean
        default: false

concurrency:
  group: social
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  social:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
      META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
      META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
      POSTFORME_API_KEY: ${{ secrets.POSTFORME_API_KEY }}
      TIKTOK_HANDLE: ${{ secrets.TIKTOK_HANDLE }}
      STATE_KEY: ${{ secrets.STATE_KEY }}
      NOTICE_LABEL: ${{ secrets.NOTICE_LABEL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main          # the newest state.enc, not the commit the run was queued on
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Post what is due
        run: python social.py
      - name: Save state
        if: always()
        run: |
          git config user.name "poster-bot"
          git config user.email "${{ github.repository_owner_id }}+${{ github.repository_owner }}@users.noreply.github.com"
          git add state.enc
          git diff --cached --quiet && exit 0
          git commit -m "social: post state"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done
          exit 1
